name: Check NNO versions

on:
  workflow_dispatch:
    inputs:
      create_pr:
        description: Open a PR when tracked versions change
        type: boolean
        default: false

jobs:
  check-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install version checker dependencies
        run: pip install -r .github/scripts/gpu_operator_versions/requirements.txt
      - name: Preview version update
        if: ${{ !inputs.create_pr }}
        run: PYTHONPATH=.github/scripts python -m nno_versions.update_versions --dry-run
      - name: Update tracked versions
        if: ${{ inputs.create_pr }}
        run: PYTHONPATH=.github/scripts python -m nno_versions.update_versions
      - name: Create pull request
        if: ${{ inputs.create_pr }}
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: .github/scripts/nno_versions/versions.json
          base: ${{ github.event.repository.default_branch }}
          branch: codex/update-nno-versions
          commit-message: Update NNO versions
          title: '[Automatic] Update NNO versions'
          body: Refresh the tracked NNO and OpenShift versions.
          delete-branch: true
